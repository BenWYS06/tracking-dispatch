server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # React Router: any unknown path falls back to index.html
    location / {
        try_files $uri /index.html;
    }

    # Forward API calls
    # to the backend container instead of trying to serve them as files.
    location /api {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Spring Security OAuth2 endpoints: login start + Google callback.
    # APP_BASE_URL points at this nginx, so the callback lands here.
    location ~ ^/(oauth2|login/oauth2)/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
